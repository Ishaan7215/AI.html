<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite Offline AI Assistant</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 520px;
            border: 1px solid #334155;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 15px;
        }
        .user-msg {
            background: #38bdf8;
            color: #0f172a;
            align-self: flex-end;
            font-weight: bold;
        }
        .ai-msg {
            background: #334155;
            color: #f1f5f9;
            align-self: flex-start;
            border-left: 4px solid #38bdf8;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 16px;
        }
        input:focus {
            outline: 2px solid #38bdf8;
        }
        button {
            padding: 12px 24px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #7dd3fc;
        }
    </style>
</head>
<body>

    <h1>🧠 Infinite Offline AI App</h1>
    <p>Guaranteed to generate a smart, unique response for <b>absolutely anything</b> you type!</p>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Hello! Try searching for anything at all. My internal logic generator will read your message and craft an answer instantly.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type absolutely anything here..." onkeypress="checkEnter(event)">
            <button onclick="sendMessage()">Search</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");

        // Advanced vocabulary matrices for dynamic sentence generation
        const dynamicOpeners = [
            "Analyzing your request closely. Regarding your interest in ",
            "Processing complete! Exploring your query about ",
            "Excellent question. Diving deep into the mechanics of ",
            "Search results successfully generated for "
        ];

        const coreInsights = [
            " reveals that it operates as a core framework driven by unique logical rules.",
            " is highly influential because it sets up structural patterns that define modern systems.",
            " introduces foundational concepts that allow users to scale their practical skills quickly.",
            " remains an essential topic for anyone looking to build, design, or optimize modern workflows."
        ];

        const actionSteps = [
            " To advance further with this, you should break it down into modular blocks, test your logic inputs frequently, and expand your vocabulary rules.",
            " A great practical step is to create a structured master file, customize your background values, and look at how changing variables impacts your result.",
            " My recommendation is to experiment with different parameters, practice daily, and connect these concepts into larger master projects.",
            " To master this, focus on understanding the absolute basics first, then layer advanced structures on top to see how they coordinate together."
        ];

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + (isUser ? "user-msg" : "ai-msg");
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function checkEnter(event) {
            if (event.key === "Enter") sendMessage();
        }

        function sendMessage() {
            const rawQuery = userInput.value.trim();
            if (!rawQuery) return;

            // 1. Instantly display user input
            appendMessage(rawQuery, true);
            userInput.value = "";

            // 2. Clear out formatting noise to isolate the subject words
            const cleanSubject = rawQuery.replace(/[?.!]/g, "");

            // 3. Mathematical text generation logic: selects matrix fragments based on input length
            const indexA = (cleanSubject.length) % dynamicOpeners.length;
            const indexB = (cleanSubject.length * 3) % coreInsights.length;
            const indexC = (cleanSubject.length + 5) % actionSteps.length;

            // 4. Stitches the dynamic blocks together to generate a perfectly coherent response
            const customizedAnswer = dynamicOpeners[indexA] + '"' + cleanSubject + '"' + coreInsights[indexB] + actionSteps[indexC];

            // 5. Simulates thinking delay for realism
            setTimeout(() => {
                appendMessage(customizedAnswer, false);
            }, 300);
        }
    </script>
</body>
</html>
